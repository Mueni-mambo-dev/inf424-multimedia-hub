        <nav>

                <li><a href="index.html" class="active">Home</a></li>

        <h1>EduStream Multimedia Hub</h1>
    </header>

    <main>
        <section>
            <h2>Featured Image</h2>
            <picture>
            <img src="images/background.png" alt="EduStream Hero Image" width="600" height="400">
                <source srcset="images/aviv.avif" type="image/avif">
                <source srcset="images/webp.webp" type="image/webp">
    
            </picture>
        </section>

        <section>
            <h2>Interactive SVG</h2>
            <svg width="300" height="200" role="img" aria-labelledby="svgTitle svgDesc">
                <title id="svgTitle">Educational Icon Set</title>
                <desc id="svgDesc">An icon with book, pencil, computer, globe, and lightbulb representing learning</desc>

                <!-- Book -->
                <rect x="10" y="50" width="50" height="70" fill="#3498db"/>
                <!-- Pencil -->
                <polygon points="70,50 80,50 90,100 80,100" fill="#e74c3c"/>
                <!-- Computer -->
                <rect x="100" y="60" width="60" height="40" fill="#2ecc71"/>
                <!-- Globe -->
                <circle cx="200" cy="80" r="20" fill="#f1c40f"/>
                <!-- Lightbulb -->
                <ellipse cx="250" cy="80" rx="15" ry="25" fill="#e67e22"/>
            </svg>
        </section>
    </main>

    <footer>
        <p>Virginia Mueni | INF 424-Multimedia programming | INF/006/2022</p>
    </footer>
</body>
